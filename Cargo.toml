[workspace]
resolver = "2"
members = [
    "crates/arcane_core",
    "crates/arcane_math",
    "crates/arcane_ecs",
    "crates/arcane_render",
    "crates/arcane_world",
    "crates/arcane_assets",
    "crates/arcane_audio",
    "crates/arcane_physics",
    "crates/arcane_input",
    "crates/arcane_ui",
    "crates/arcane_vfx",
    "crates/game",
    "Tools/asset_pipeline",
]
default-members = ["crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Mystical Arcana Project"]
repository = "https://github.com/Nexusdeveloper902/Mystical-Arcana"

[workspace.dependencies]
# === Logging / diagnostics ===
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
postcard = { version = "1", features = ["use-std"] }
bincode = "1"

# === Math ===
nalgebra = { version = "0.34", features = ["serde-serialize"] }
nalgebra-glm = "0.21"
glam = { version = "0.29", features = ["serde"] }

# === Error handling ===
anyhow = "1"
thiserror = "2"

# === Concurrency ===
rayon = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
atomic_refcell = "0.1"

# === Collections / utilities ===
hashbrown = { version = "0.15", features = ["serde"] }
ahash = "0.8"
smallvec = { version = "1", features = ["serde", "union", "const_generics"] }
bitflags = { version = "2", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }

# === Rendering (Vulkan) ===
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
gpu-allocator = "0.27"
# Render Observatory (browser-accessible HTTP server for visual feedback)
tiny_http = "0.12"

# === Assets ===
gltf = { version = "1", features = ["utils"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
meshopt = "0.4" # placeholder

# === Audio ===
kira = "0.10"
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }

# === Physics ===
rapier3d = { version = "0.23", features = ["serde-serialize"] }

# === Input ===
gilrs = "0.10"

# === Profiling ===
puffin = "0.19"

# === Testing ===
proptest = "1"
pretty_assertions = "1"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

# Test profile: optimize the procedural/world/streaming test binaries.
# Default `cargo test` uses opt-level=0 which is too slow for compute-heavy
# world-generation tests. Setting opt-level=2 here gives the procedural
# generator a ~10-30x speedup at the cost of slightly slower test compilation.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
